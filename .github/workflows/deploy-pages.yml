name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy by hand from the Actions tab — the one you'll
  # actually use the first time, before push-to-deploy is worth trusting.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Installs both workspace members (packages/core, apps/web) from the
      # single root lockfile — see the README on why apps/mobile, if it comes
      # back, must NOT join this same install.
      - run: npm ci

      - run: npm test

      - name: Build static export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Only needed for a project page (username.github.io/<repo>). Leave
          # this repo variable unset entirely if this repo IS your
          # username.github.io user page, which is served at the domain root.
          NEXT_BASE_PATH: ${{ vars.NEXT_BASE_PATH }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
